name: Sono
options:
  bundleIdPrefix: com.aeyar
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
  # Local polish backend. MLX is Apple's own inference framework and the fastest
  # option under 14B on Apple Silicon; Ollama was rejected because it is a
  # separate app the user has to install and keep running, which breaks the
  # "download it and it works" promise. The two huggingface packages supply the
  # downloader and the tokenizer that MLXLMCommon leaves pluggable.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  Sono:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Assets/Sono.icns
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    entitlements:
      path: Sono.entitlements
      properties:
        # ponytail: sandbox OFF — CGEvent paste needs it. Direct distribution.
        com.apple.security.app-sandbox: false
        # Hardened runtime denies mic instantly (no dialog!) without this.
        com.apple.security.device.audio-input: true
        # Hardened runtime blocks the sherpa-onnx dylibs (different signer) without this.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: Sono transcribes your speech on this Mac. Audio never leaves the device.
        # Both derive from the build settings below, so there is exactly one
        # place to bump. Hardcoding these is how 1.0 shipped reporting "0.1"
        # while the appcast advertised "1.0".
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Sparkle compares THIS against sparkle:version in the appcast. If it
        # does not increase every release, the updater offers the same build
        # forever: install, still reads the old number, offer again.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: Sono
        # The canonical user-facing name. Without it macOS falls back to the
        # bundle filename in some panes, which is how "Sono.app" appears instead
        # of "Sono".
        CFBundleDisplayName: Sono
        # Sparkle. The private key lives in the login Keychain and never ships;
        # this public half is what verifies a downloaded update was signed by us.
        SUPublicEDKey: c/caRWSt7Qqdvik5VuW/poI3O8uMWtdJURb51uFihzY=
        SUFeedURL: https://heysono.app/appcast.xml
        SUScheduledCheckInterval: 86400
        # No macOS version, CPU or Mac model appended to the update check.
        SUEnableSystemProfiling: false
        # Registers the bundled font family without any code.
        ATSApplicationFontsPath: Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeyar.Sono
        DEVELOPMENT_TEAM: J9JLP45K5F
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.2"
        # Monotonic. Bump on every release, never reuse.
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"   # ponytail: Swift 6 strict concurrency vs AVAudioEngine taps is a fight for later
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Vendor/sherpa
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/sherpa/lib
        OTHER_LDFLAGS: -lsherpa-onnx-c-api -lonnxruntime
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Embed sherpa dylibs
        script: |
          set -e
          DEST="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          for lib in libsherpa-onnx-c-api.dylib libonnxruntime.dylib libonnxruntime.1.24.4.dylib; do
            cp -f "$PROJECT_DIR/Vendor/sherpa/lib/$lib" "$DEST/$lib"
            codesign --force --sign - "$DEST/$lib"
          done
        basedOnDependencyAnalysis: false
